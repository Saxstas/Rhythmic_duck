<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rhythm Master Pro - Mic Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; background-color: #1a1a2e; color: #ffffff; margin: 0; padding: 10px; overflow: hidden; user-select: none; touch-action: none; }
        .main-container { width: 100%; max-width: 500px; margin: 0 auto; background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { font-size: 1.2rem; color: #00cec9; text-transform: uppercase; margin: 5px 0 5px 0; letter-spacing: 2px; }
        .screen { display: none; }
        #menuScreen { display: block; }
        
        /* РЕЙТИНГ И ЗВЕЗДЫ */
        .rank-box { background: linear-gradient(135deg, rgba(0, 206, 201, 0.1), rgba(9, 132, 227, 0.1)); border: 1px solid rgba(0, 206, 201, 0.3); border-radius: 12px; padding: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .rank-title { font-weight: bold; color: #00cec9; }
        .total-stars { color: #fdcb6e; font-weight: bold; }
        
        .levels-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 12px; }
        .level-btn { background: #2d2d44; color: white; border: 1px solid #3d3d5c; padding: 8px 0; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
        .level-btn.active { background: #00cec9; color: #1a1a2e; border-color: #00cec9; box-shadow: 0 0 15px rgba(0, 206, 201, 0.5); }
        .level-stars { font-size: 10px; color: #fdcb6e; }

        .primary-btn { background: linear-gradient(135deg, #00cec9, #0984e3); color: white; font-weight: bold; width: 100%; padding: 15px; font-size: 18px; border-radius: 12px; border: none; margin-bottom: 10px; cursor: pointer; }
        .secondary-btn { background: #2d2d44; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; width: 100%; margin-bottom: 10px; cursor: pointer; }
        
        .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;}
        .stars-display { font-size: 1.2rem; display: flex; gap: 4px; }
        .star-item { color: rgba(255, 255, 255, 0.15); transition: all 0.3s; }
        .star-item.filled { color: #fdcb6e; text-shadow: 0 0 8px rgba(253, 203, 110, 0.6); }
        .star-pop { animation: starPop 0.4s cubic-bezier(0.17, 0.89, 0.32, 1.49); }
        @keyframes starPop { 0% { transform: scale(1); } 50% { transform: scale(1.5); } 100% { transform: scale(1); } }

        .grid { display: flex; justify-content: center; align-items: center; gap: 8px; min-height: 140px; background: rgba(0,0,0,0.4); border-radius: 15px; padding: 15px; margin-bottom: 15px; border: 2px solid #2d2d44; }
        .image-card { width: 20vw; height: 20vw; max-width: 80px; max-height: 80px; object-fit: cover; border-radius: 10px; border: 3px solid #3d3d5c; opacity: 0; transition: 0.1s; background: #2d2d44; display: none; }
        .image-card.loaded { opacity: 1; }
        .image-card.double-size { width: 42vw; max-width: 170px; }
        .active-slot { border-color: #00cec9 !important; transform: scale(1.05); }

        /* ЗОНА ТАПА И КАЛИБРОВКА - ТЕПЕРЬ КАК ЭКРАН СТАТУСА */
        .tap-area { background: rgba(0, 206, 201, 0.05); border: 2px dashed #00cec9; border-radius: 15px; height: 100px; display: flex; justify-content: center; align-items: center; font-size: 1.3rem; color: #00cec9; font-weight: bold; transition: 0.3s; }
        .tap-area.recording { background: rgba(255, 71, 87, 0.2); border: 2px solid #ff4757; color: #ff4757; }
        .tap-area.analyzing { background: rgba(253, 203, 110, 0.2); border: 2px solid #fdcb6e; color: #fdcb6e; }
        
        #calibProgress { font-size: 1.5rem; color: #fdcb6e; margin: 20px 0; font-weight: bold; min-height: 2em; }
        #calibValueDisplay { margin-bottom: 20px; color: #a4b0be; font-family: monospace; }
    </style>
</head>
<body>

<div class="main-container">
    <div id="menuScreen" class="screen">
        <h1>RHYTHM MASTER</h1>
        <div class="rank-box">
            <div>Ранг: <span class="rank-title" id="playerRank">Новичок</span></div>
            <div class="total-stars" id="totalStarsDisplay">★ 0</div>
        </div>
        <div class="levels-container" id="levelsGrid"></div>
        <button id="startGameBtn" class="primary-btn">ИГРАТЬ</button>
        <button id="calibOpenBtn" class="secondary-btn">⚙️ КАЛИБРОВКА МИКРОФОНА</button>
    </div>

    <div id="gameScreen" class="screen">
        <div class="nav-header">
            <button id="backBtn" class="secondary-btn" style="width:auto; margin:0">← МЕНЮ</button>
            <div class="stars-display" id="gameStarsDisplay"></div>
            <h1 style="margin:0; font-size: 1rem;">LVL <span id="currentLevelDisplay">1</span></h1>
        </div>
        <div style="display:flex; justify-content: space-between; margin-bottom: 10px;">
            <div style="color:#fdcb6e; font-weight:bold">SCORE: <span id="scoreDisplay">0</span></div>
            <div id="feedbackDisplay" style="color:#00cec9; font-weight:bold">READY</div>
        </div>
        
        <button id="shuffleBtn" class="primary-btn" style="padding: 10px; font-size: 14px;">ПЕРЕМЕШАТЬ КАРТЫ</button>
        
        <div id="imageContainer" class="grid">
            <img class="image-card">
            <img class="image-card">
            <img class="image-card">
            <img class="image-card">
        </div>

        <div id="statusArea" class="tap-area">🎙️ ГОТОВ К ЗАПИСИ</div>
        
        <div style="margin-top:15px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 12px;">
            <button id="metronomeBtn" class="primary-btn" style="margin:0">СТАРТ</button>
            <input type="range" id="bpmRange" min="60" max="180" value="120" style="width:100%; margin: 10px 0;">
            <div id="bpmValue">120 BPM</div>
        </div>
    </div>

    <div id="calibrationScreen" class="screen">
        <h1>КАЛИБРОВКА</h1>
        <p style="font-size: 0.8rem; color: #a4b0be;">Нажмите НАЧАТЬ, дождитесь отсчета и сыграйте ровно 4 ноты в такт метроному. Это настроит задержку микрофона.</p>
        <div id="calibProgress">НАЖМИТЕ НАЧАТЬ</div>
        <div id="calibStatusArea" class="tap-area" style="margin-bottom: 15px;">🎙️ ТЕСТ МИКРОФОНА</div>
        <div id="calibValueDisplay">Задержка: --</div>
        <button id="calibStartBtn" class="primary-btn">НАЧАТЬ</button>
        <button id="calibBackBtn" class="secondary-btn">← ГОТОВО / В МЕНЮ</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // СЮДА ВСТАВЬ СВОЙ ПОЛНЫЙ СПИСОК УРОВНЕЙ!
    const levelPacks = {
        1: [{ src: "Lvl1/s1.png", size: 1, pattern: [0] }, { src: "Lvl1/Size2/6.png", size: 2, pattern: [0] }],
        2: [{ src: "lvl2/2.png", size: 1, pattern: [0, 0.5] }],
        3: [{ src: "Lvl3/4.png", size: 1, pattern: [] }, { src: "Lvl3/5.png", size: 1, pattern: [] }, { src: "Lvl3/Size2/30.png", size: 2, pattern: [] }],
        4: [{ src: "Lvl4/size2/9.png", size: 2, pattern: [0, 1, 1.5] }],
        5: [{ src: "Lvl5/3.png", size: 1, pattern: [0.5] }],
        6: [{ src: "Lvl6/Size2/7.png", size: 2, pattern: [0, 1.5] }, { src: "Lvl6/Size2/8.png", size: 2, pattern: [0, 0.5] }],
        7: [{ src: "Lvl7/Size2/10.png", size: 2, pattern: [0.5, 1.5] }, { src: "Lvl7/Size2/11.png", size: 2, pattern: [0.5] }],
        8: [{ src: "Lvl8/24.png", size: 1, pattern: [0, 0.25, 0.5, 0.75] }],
        9: [{ src: "Lvl9/27.png", size: 1, pattern: [0, 0.5, 0.75] }, { src: "Lvl9/26.png", size: 1, pattern: [0, 0.25, 0.5] }],
        10: [{ src: "Lvl10/13.png", size: 1, pattern: [0, 0.25, 0.50] }, { src: "Lvl10/15.png", size: 1, pattern: [0, 0.50, 0.75] }],
        11: [{ src: "Lvl11/18.png", size: 1, pattern: [0.50, 0.75] }, { src: "Lvl11/19.png", size: 1, pattern: [0, 0.25] }],
        12: [{ src: "Lvl12/25.png", size: 1, pattern: [0.25, 0.5, 0.75] }],
        13: [{ src: "Lvl13/14.png", size: 1, pattern: [0, 0.25, 0.75] }, { src: "Lvl13/31.png", size: 1, pattern: [0, 0.75] }],
        14: [{ src: "Lvl14/20.png", size: 1, pattern: [0, 0.5] }],
        15: [{ src: "Lvl15/17.png", size: 1, pattern: [0, 0.25] }, { src: "Lvl15/23.png", size: 1, pattern: [0, 0.75] }],
        16: [{ src: "Lvl16/21.png", size: 1, pattern: [0.25, 0.5, 0.75] }],
        17: [{ src: "Lvl17/16.png", size: 1, pattern: [0.25, 0.75] }, { src: "Lvl17/33.png", size: 1, pattern: [0.25] }],
        18: [{ src: "Lvl18/34.png", size: 1, pattern: [0.75] }],
        19: [{ src: "Lvl19/12.png", size: 1, pattern: [0, 0.33, 0.66] }]
    };


    let currentLevel = 1, score = 0;
    let audioCtx, nextBeatTime, timerID;
    let perfectStreak = 0, lastStarsCount = 0;
    let currentSequence = [];
    
    // Переменные Аудиодвижка
    let micStream = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let state = 'IDLE'; // IDLE, COUNTDOWN, RECORDING, ANALYZING
    let beatCount = 0;
    
    let userOffset = parseFloat(localStorage.getItem('rhythm_mic_offset')) || 0.05;
    let isCalibrating = false;
    let levelStars = JSON.parse(localStorage.getItem('rhythm_stars')) || {};

    // --- НАВИГАЦИЯ ---
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        document.getElementById(id).style.display = 'block';
    }

    function updateRank() {
        let total = Object.values(levelStars).reduce((a, b) => a + b, 0);
        document.getElementById('totalStarsDisplay').innerText = `★ ${total}`;
        let rank = "Новичок", color = "#a4b0be";
        if (total >= 40) { rank = "Бог Ритма"; color = "#ff4757"; }
        else if (total >= 25) { rank = "Мастер"; color = "#fdcb6e"; }
        else if (total >= 10) { rank = "Профи"; color = "#00cec9"; }
        const rEl = document.getElementById('playerRank');
        rEl.innerText = rank; rEl.style.color = color;
    }

    function initLevels() {
        updateRank();
        const grid = document.getElementById('levelsGrid');
        grid.innerHTML = '';
        for(let i=1; i<=19; i++) {
            const b = document.createElement('button');
            const stars = levelStars[i] || 0;
            b.className = 'level-btn' + (i === currentLevel ? ' active' : '');
            b.innerHTML = `<span>${i}</span><span class="level-stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</span>`;
            b.onclick = () => { currentLevel = i; initLevels(); };
            grid.appendChild(b);
        }
    }

    function updateStarsUI() {
        const display = document.getElementById('gameStarsDisplay');
        let currentStars = perfectStreak >= 5 ? 3 : (perfectStreak >= 2 ? 2 : (perfectStreak >= 1 ? 1 : 0));
        display.innerHTML = '';
        for(let s=0; s<3; s++) {
            const span = document.createElement('span');
            span.className = 'star-item' + (s < currentStars ? ' filled' : '');
            if (s < currentStars && s >= lastStarsCount) span.classList.add('star-pop');
            span.innerText = '★';
            display.appendChild(span);
        }
        if (currentStars > (levelStars[currentLevel] || 0)) {
            levelStars[currentLevel] = currentStars;
            localStorage.setItem('rhythm_stars', JSON.stringify(levelStars));
        }
        lastStarsCount = currentStars;
    }

    function roll() {
        const pool = [];
        for(let i=1; i<=currentLevel; i++) if(levelPacks[i]) pool.push(...levelPacks[i]);
        let seq = [], total = 0;
        while(total < 4) {
            let item = pool[Math.floor(Math.random() * pool.length)];
            if(total + item.size <= 4) { seq.push(item); total += item.size; }
        }
        currentSequence = seq;

        const images = document.querySelectorAll('#imageContainer .image-card');
        images.forEach(img => {
            img.style.display = 'none';
            img.classList.remove('loaded', 'active-slot');
        });

        seq.forEach((item, idx) => {
            const img = images[idx];
            img.src = item.src;
            img.className = 'image-card' + (item.size === 2 ? ' double-size' : '');
            img.style.display = 'block';
            img.onload = () => img.classList.add('loaded');
        });
    }

    // --- ДОСТУП К МИКРОФОНУ ---
    async function initMic() {
        if (micStream) return true;
        try {
            micStream = await navigator.mediaDevices.getUserMedia({ 
                audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
            });
            return true;
        } catch (e) {
            alert("Пожалуйста, разрешите доступ к микрофону для игры!");
            return false;
        }
    }

    // --- ЦИКЛ МЕТРОНОМА И ЗАПИСИ ---
    function startEngine() {
        state = 'COUNTDOWN';
        beatCount = 0;
        nextBeatTime = audioCtx.currentTime;
        scheduler();
        document.getElementById('metronomeBtn').innerText = "ОСТАНОВИТЬ";
        document.getElementById('metronomeBtn').disabled = true; 
    }

    function playTick() {
        const bpm = isCalibrating ? 70 : document.getElementById('bpmRange').value;
        const spb = 60 / bpm;
        const now = audioCtx.currentTime;
        const uiPrefix = isCalibrating ? "calib" : "";
        const statusArea = isCalibrating ? document.getElementById('calibStatusArea') : document.getElementById('statusArea');

        // Звук метронома (делаем тихим, чтобы микрофон ловил только саксофон)
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = (beatCount === 0) ? 880 : 440;
        gain.gain.setValueAtTime(0.02, now); // Очень тихий клик
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.05);

        if (state === 'COUNTDOWN') {
            const fb = isCalibrating ? document.getElementById('calibProgress') : document.getElementById('feedbackDisplay');
            fb.innerText = `ОТСЧЕТ: ${4 - beatCount}`;
            beatCount++;
            
            if (beatCount === 4) {
                state = 'RECORDING';
                beatCount = 0;
                startRecording();
                statusArea.className = 'tap-area recording';
                statusArea.innerText = "🔴 ИДЕТ ЗАПИСЬ!";
            }
        } 
        else if (state === 'RECORDING') {
            if(!isCalibrating) document.getElementById('feedbackDisplay').innerText = "ИГРАЙТЕ!";
            
            // Подсветка карточек
            if (!isCalibrating) {
                const cards = document.querySelectorAll('.image-card');
                cards.forEach(c => c.classList.remove('active-slot'));
                let acc = 0;
                currentSequence.forEach((item, idx) => {
                    if (beatCount >= acc && beatCount < acc + item.size) cards[idx].classList.add('active-slot');
                    acc += item.size;
                });
            }

            beatCount++;
            if (beatCount === 4) {
                state = 'ANALYZING';
                statusArea.className = 'tap-area analyzing';
                statusArea.innerText = "⚙️ ОБРАБОТКА...";
                if(!isCalibrating) document.getElementById('feedbackDisplay').innerText = "АНАЛИЗ...";
                
                // Останавливаем запись с небольшой задержкой, чтобы поймать последнюю ноту
                setTimeout(stopRecording, (spb + 0.3) * 1000);
            }
        }
    }

    function scheduler() {
        if (state === 'IDLE' || state === 'ANALYZING') return;
        const bpm = isCalibrating ? 70 : document.getElementById('bpmRange').value;
        const spb = 60 / bpm;
        
        while(nextBeatTime < audioCtx.currentTime + 0.1) {
            playTick();
            nextBeatTime += spb;
        }
        timerID = setTimeout(scheduler, 25);
    }

    // --- РАБОТА С MediaRecorder ---
    function startRecording() {
        audioChunks = [];
        mediaRecorder = new MediaRecorder(micStream);
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = processAudio;
        mediaRecorder.start();
    }

    function stopRecording() {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
        }
    }

    // --- АНАЛИЗ АУДИО (Поиск атак саксофона) ---
    async function processAudio() {
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        const arrayBuffer = await blob.arrayBuffer();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        const data = audioBuffer.getChannelData(0);
        const sampleRate = audioBuffer.sampleRate;
        
        // Умный поиск громкости (адаптируется под громкость саксофона)
        let maxVol = 0;
        for(let i=0; i<data.length; i++) if(Math.abs(data[i]) > maxVol) maxVol = Math.abs(data[i]);
        
        const threshold = Math.max(0.05, maxVol * 0.3); // Ищем пики выше 30% от максимума записи
        const peaks = [];
        const debounceFrames = sampleRate * 0.15; // Минимум 150мс между нотами
        let lastPeakFrame = -debounceFrames;
        
        for (let i = 0; i < data.length; i++) {
            if (Math.abs(data[i]) > threshold) {
                if (i - lastPeakFrame > debounceFrames) {
                    peaks.push(i / sampleRate); // Сохраняем время пика в секундах
                    lastPeakFrame = i;
                }
            }
        }

        const bpm = isCalibrating ? 70 : document.getElementById('bpmRange').value;
        const spb = 60 / bpm;

        if (isCalibrating) {
            evaluateCalibration(peaks, spb);
        } else {
            const expectedTargets = [];
            let acc = 0;
            currentSequence.forEach(item => {
                item.pattern.forEach(p => expectedTargets.push((acc + p) * spb));
                acc += item.size;
            });
            evaluateGameplay(peaks, expectedTargets);
        }
    }

    function evaluateCalibration(peaks, spb) {
        // Мы ждали 4 ровных удара: 0, spb, 2*spb, 3*spb
        if (peaks.length < 2) {
            document.getElementById('calibProgress').innerText = "Слишком тихо. Попробуйте еще раз.";
        } else {
            let totalOffset = 0;
            let validPeaks = 0;
            for(let i=0; i < Math.min(peaks.length, 4); i++) {
                totalOffset += (peaks[i] - (i * spb));
                validPeaks++;
            }
            userOffset = totalOffset / validPeaks;
            localStorage.setItem('rhythm_mic_offset', userOffset);
            
            document.getElementById('calibValueDisplay').innerText = `Задержка: ${userOffset.toFixed(3)}s`;
            document.getElementById('calibProgress').innerText = "ОТКАЛИБРОВАНО!";
        }
        
        resetEngine("calibStatusArea", "calibStartBtn");
    }

    function evaluateGameplay(peaks, expectedTargets) {
        let cycleHits = 0;
        let cycleMisses = 0;
        const matchedPeaks = new Set();
        
        expectedTargets.forEach(target => {
            let bestDiff = Infinity;
            let bestPeakIdx = -1;
            const adjustedTarget = target + userOffset; // Коррекция задержки
            
            peaks.forEach((peak, pIdx) => {
                if (matchedPeaks.has(pIdx)) return;
                const diff = Math.abs(peak - adjustedTarget);
                if (diff < bestDiff) { bestDiff = diff; bestPeakIdx = pIdx; }
            });
            
            if (bestDiff <= 0.20) { cycleHits++; score += 100; matchedPeaks.add(bestPeakIdx); } // PERFECT
            else if (bestDiff <= 0.45) { cycleHits++; score += 50; matchedPeaks.add(bestPeakIdx); } // GOOD
            else { cycleMisses++; score = Math.max(0, score - 30); } // MISS
        });
        
        const extraPeaks = peaks.length - matchedPeaks.size;
        score = Math.max(0, score - (extraPeaks * 15)); // Штраф за лишние ноты
        document.getElementById('scoreDisplay').innerText = score;
        
        const fb = document.getElementById('feedbackDisplay');
        if (cycleHits === expectedTargets.length && cycleMisses === 0 && extraPeaks === 0) {
            perfectStreak++;
            fb.innerText = "ОТЛИЧНО!"; fb.style.color = "#00cec9";
            setTimeout(roll, 1000); // Авто-перемешивание при идеальной игре
        } else {
            perfectStreak = 0;
            fb.innerText = `ОШИБКИ (Ноты: ${peaks.length}/${expectedTargets.length})`; fb.style.color = "#ff4757";
        }
        
        updateStarsUI();
        resetEngine("statusArea", "metronomeBtn");
    }

    function resetEngine(statusAreaId, btnId) {
        state = 'IDLE';
        const statusArea = document.getElementById(statusAreaId);
        statusArea.className = 'tap-area';
        statusArea.innerText = "🎙️ ГОТОВ К ЗАПИСИ";
        
        const btn = document.getElementById(btnId);
        btn.innerText = "СТАРТ";
        btn.disabled = false;
        document.querySelectorAll('.image-card').forEach(c => c.classList.remove('active-slot'));
    }

    // --- СОБЫТИЯ КНОПОК ---
    document.getElementById('startGameBtn').onclick = () => { 
        showScreen('gameScreen');
        document.getElementById('currentLevelDisplay').innerText = currentLevel;
        perfectStreak = 0; lastStarsCount = 0; updateStarsUI(); roll();
    };

    document.getElementById('calibOpenBtn').onclick = () => { 
        showScreen('calibrationScreen');
        document.getElementById('calibValueDisplay').innerText = `Текущая задержка: ${userOffset.toFixed(3)}s`;
        document.getElementById('calibProgress').innerText = "НАЖМИТЕ НАЧАТЬ";
    };

    document.getElementById('calibBackBtn').onclick = () => { initLevels(); showScreen('menuScreen'); };

    document.getElementById('calibStartBtn').onclick = async function() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (await initMic()) {
            isCalibrating = true;
            startEngine();
        }
    };

    document.getElementById('backBtn').onclick = () => { initLevels(); showScreen('menuScreen'); };

    document.getElementById('metronomeBtn').onclick = async function() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (await initMic()) {
            isCalibrating = false;
            startEngine();
        }
    };

    document.getElementById('shuffleBtn').onclick = () => { roll(); };
    document.getElementById('bpmRange').oninput = function() { document.getElementById('bpmValue').innerText = this.value + " BPM"; };

    initLevels();
</script>
</body>
</html>
