<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rhythmic Duck — студия ритма</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { color-scheme: dark; --ink:#f6f0df; --muted:#a99d84; --panel:#18241f; --panel2:#202e28; --line:rgba(235,190,107,.2); --gold:#e5b45f; --mint:#8dd3b4; --red:#d77962; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; text-align:center; background:radial-gradient(ellipse at 50% -15%, #384b3b 0%, #18231f 44%, #101715 100%); color:var(--ink); margin:0; padding:18px 12px; min-height:100vh; overflow:auto; user-select:none; touch-action:pan-y; }
        .main-container { width:100%; max-width:560px; margin:0 auto; background:linear-gradient(160deg,rgba(36,51,43,.97),rgba(21,32,28,.98)); padding:22px; border:1px solid var(--line); border-radius:26px; box-shadow:0 24px 70px rgba(0,0,0,.36); }
        h1 { font-size:1.25rem; color:var(--gold); text-transform:uppercase; margin:5px 0; letter-spacing:3px; }
        .brand-kicker { color:var(--mint); font-size:10px; font-weight:800; letter-spacing:3px; text-transform:uppercase; }
        .intro { color:var(--muted); margin:6px 0 20px; font-size:13px; }
        .screen { display: none; }
        #menuScreen { display: block; }
        .student-panel { text-align:left; padding:17px; margin:0 0 14px; border:1px solid var(--line); border-radius:18px; background:linear-gradient(135deg,rgba(229,180,95,.1),rgba(141,211,180,.045)); }
        .section-label { display:block; color:var(--muted); font-size:10px; font-weight:800; letter-spacing:2px; text-transform:uppercase; margin:0 0 9px; }
        .student-row { display:flex; align-items:center; gap:10px; }
        .student-avatar { width:42px; height:42px; flex:none; display:grid; place-items:center; border-radius:14px; color:#17231d; background:linear-gradient(145deg,var(--gold),#f0d89f); font-size:20px; }
        select, input[type=text] { min-width:0; width:100%; color:var(--ink); background:#25332c; border:1px solid var(--line); border-radius:11px; padding:12px; font:inherit; outline:none; }
        select:focus, input[type=text]:focus { border-color:var(--gold); }
        .student-actions { display:flex; gap:7px; margin-top:11px; }
        .student-meta { display:flex; justify-content:space-between; gap:8px; margin-top:12px; color:var(--muted); font-size:12px; }
        .channel-link { display:flex; align-items:center; justify-content:center; gap:9px; color:var(--mint); text-decoration:none; font-size:12px; font-weight:800; padding:11px; border:1px solid rgba(141,211,180,.16); background:rgba(141,211,180,.045); border-radius:12px; margin:0 0 10px; transition:.18s; }
        .channel-link:hover { color:#b8efd4; border-color:rgba(141,211,180,.38); background:rgba(141,211,180,.08); }
        .rank-box { background:rgba(0,0,0,.13); border:1px solid rgba(255,255,255,.06); border-radius:14px; padding:11px 14px; margin:0 0 16px; display:flex; justify-content:space-between; align-items:center; font-size:13px; }
        .rank-title { font-weight:800; color:var(--mint); }
        .total-stars { color:var(--gold); font-weight:800; }
        .mode-panel { text-align:left; margin:0 0 16px; }
        .mode-switch { display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:5px; background:rgba(0,0,0,.2); border-radius:13px; }
        .mode-btn { border:0; background:transparent; color:var(--muted); padding:11px 8px; font-weight:800; font-size:12px; border-radius:9px; cursor:pointer; }
        .mode-btn.active { background:var(--panel2); color:var(--gold); box-shadow:0 3px 10px rgba(0,0,0,.2); }
        .levels-heading { display:flex; align-items:center; justify-content:space-between; margin:17px 2px 9px; text-align:left; }
        .levels-heading strong { font-size:13px; letter-spacing:.3px; }
        .levels-heading span { font-size:11px; color:var(--muted); }
        .levels-container { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px; background:rgba(0,0,0,.16); padding:10px; border-radius:16px; }
        .level-btn { background:var(--panel2); color:var(--ink); border:1px solid rgba(255,255,255,.06); padding:10px 0; font-size:14px; font-weight:800; border-radius:12px; cursor:pointer; display:flex; flex-direction:column; gap:3px; transition:.18s ease; }
        .level-btn:hover { border-color:var(--line); transform:translateY(-1px); }
        .level-btn.active { background:linear-gradient(145deg,#efd18e,#dba84c); color:#19221b; border-color:var(--gold); box-shadow:0 5px 18px rgba(229,180,95,.22); }
        .level-stars { font-size:9px; color:var(--gold); letter-spacing:1px; }
        .level-btn.active .level-stars { color:#51401f; }
        button { font-family:inherit; }
        .primary-btn { background:linear-gradient(135deg,#e9c374,#d79c41); color:#17211a; font-weight:900; width:100%; padding:15px; font-size:15px; letter-spacing:.6px; border-radius:14px; border:0; margin-bottom:8px; cursor:pointer; box-shadow:0 8px 20px rgba(0,0,0,.18); transition:transform .16s,filter .16s; }
        .primary-btn:hover { filter:brightness(1.06); transform:translateY(-1px); }
        .secondary-btn { background:var(--panel2); color:var(--ink); border:1px solid rgba(255,255,255,.07); padding:10px 13px; border-radius:11px; font-weight:800; font-size:12px; cursor:pointer; }
        .quiet-btn { flex:1; background:rgba(255,255,255,.045); color:var(--muted); border:1px solid rgba(255,255,255,.06); padding:9px 6px; border-radius:10px; font-size:11px; font-weight:700; cursor:pointer; }
        .quiet-btn:hover,.secondary-btn:hover { color:var(--gold); border-color:var(--line); }
        .nav-header { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:14px; }
        .student-chip { color:var(--mint); font-size:11px; font-weight:700; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; max-width:110px; }
        .stars-display { font-size: 1.2rem; display: flex; gap: 4px; }
        .star-item { color:rgba(255,255,255,.13); transition:all .3s; }
        .star-item.filled { color:var(--gold); text-shadow:0 0 8px rgba(229,180,95,.45); }
        .star-pop { animation: starPop 0.4s cubic-bezier(0.17, 0.89, 0.32, 1.49); }
        @keyframes starPop { 0% { transform: scale(1); } 50% { transform: scale(1.5); } 100% { transform: scale(1); } }

        .grid { display:flex; justify-content:center; align-items:center; gap:8px; min-height:150px; background:radial-gradient(ellipse,rgba(229,180,95,.08),rgba(0,0,0,.23)); border-radius:18px; padding:15px; margin-bottom:13px; border:1px solid var(--line); }
        .image-card { width:20vw; height:20vw; max-width:80px; max-height:80px; object-fit:cover; border-radius:12px; border:3px solid rgba(229,180,95,.24); opacity:0; transition:.16s; background:#26342c; display:none; }
        .image-card.loaded { opacity: 1; }
        .image-card.double-size { width: 42vw; max-width: 170px; }
        .active-slot { border-color:var(--mint)!important; transform:scale(1.05); }
        .tap-area { background:rgba(141,211,180,.045); border:1px dashed rgba(141,211,180,.5); border-radius:15px; min-height:72px; display:flex; justify-content:center; align-items:center; font-size:14px; color:var(--mint); font-weight:800; transition:.3s; padding:10px; }
        .tap-area.recording { background:rgba(215,121,98,.16); border:1px solid var(--red); color:#f1a18c; }
        .tap-area.analyzing { background:rgba(229,180,95,.15); border:1px solid var(--gold); color:var(--gold); }
        .teacher-actions { display:none; grid-template-columns:1fr 1fr; gap:9px; margin:10px 0 14px; }
        .teacher-actions.visible { display:grid; }
        .review-btn { padding:13px 8px; border-radius:12px; font-weight:800; font-size:12px; border:1px solid transparent; cursor:pointer; }
        .review-btn.correct { background:rgba(141,211,180,.13); border-color:rgba(141,211,180,.25); color:var(--mint); }
        .review-btn.repeat { background:rgba(215,121,98,.11); border-color:rgba(215,121,98,.2); color:#e79b86; }
        .review-btn:disabled { opacity:.4; cursor:not-allowed; }
        .tempo-card { margin-top:13px; background:rgba(0,0,0,.17); padding:14px; border-radius:15px; border:1px solid rgba(255,255,255,.045); }
        .tempo-line { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:11px; font-weight:800; letter-spacing:1px; }
        input[type=range] { width:100%; accent-color:var(--gold); margin:13px 0 5px; }
        #bpmValue { color:var(--gold); font-size:13px; font-weight:800; }
        @media (max-width:420px) { .main-container{padding:17px 14px;border-radius:22px}.student-actions{gap:5px}.quiet-btn{font-size:10px}.levels-container{gap:6px;padding:8px}.nav-header{gap:5px}.student-chip{max-width:78px} }
    </style>
</head>
<body>

<div class="main-container">
    <div id="menuScreen" class="screen">
        <div class="brand-kicker">RHYTHMIC DUCK · САКСОФОН</div>
        <h1>Студия ритма</h1>
        <p class="intro">Короткие ритмические задания для занятий</p>
        <section class="student-panel" aria-label="Профиль ученика">
            <label class="section-label" for="studentSelect">Сейчас занимается</label>
            <div class="student-row">
                <div class="student-avatar" aria-hidden="true">♫</div>
                <select id="studentSelect" aria-label="Выбрать ученика"></select>
            </div>
            <div class="student-actions">
                <button id="addStudentBtn" class="quiet-btn">＋ Ученик</button>
                <button id="renameStudentBtn" class="quiet-btn">Переименовать</button>
                <button id="deleteStudentBtn" class="quiet-btn">Удалить</button>
            </div>
            <div class="student-meta"><span id="studentLevelMeta">Уровень 1</span><span id="studentProgressMeta">Пока без звёзд</span></div>
        </section>
        <div class="rank-box">
            <div>Прогресс ученика <span class="rank-title" id="playerRank">Новичок</span></div>
            <div class="total-stars" id="totalStarsDisplay">★ 0</div>
        </div>
        <div class="mode-panel">
            <span class="section-label">Режим занятия</span>
            <div class="mode-switch">
                <button class="mode-btn active" id="teacherModeBtn" type="button">С преподавателем</button>
                <button class="mode-btn" id="autoModeBtn" type="button">Самопроверка</button>
            </div>
        </div>
        <div class="levels-heading"><strong>Выбери уровень</strong><span>19 ступеней</span></div>
        <div class="levels-container" id="levelsGrid"></div>
        <a class="channel-link" href="https://t.me/saxstass" target="_blank" rel="noopener noreferrer" aria-label="Открыть Telegram-канал Saxstass">
            <span aria-hidden="true">✈</span><span>Telegram · @saxstass</span><span aria-hidden="true">↗</span>
        </a>
        <button id="startGameBtn" class="primary-btn">НАЧАТЬ ЗАНЯТИЕ <span aria-hidden="true">→</span></button>
    </div>

    <div id="gameScreen" class="screen">
        <div class="nav-header">
            <button id="backBtn" class="secondary-btn" style="width:auto; margin:0">← Ученики</button>
            <span id="activeStudentChip" class="student-chip"></span>
            <div class="stars-display" id="gameStarsDisplay"></div>
            <h1 style="margin:0; font-size:.9rem;">УРОВЕНЬ <span id="currentLevelDisplay">1</span></h1>
        </div>
        <div style="display:flex; justify-content: space-between; margin-bottom: 10px;">
            <div style="color:var(--gold); font-weight:800; font-size:12px">ОЧКИ <span id="scoreDisplay">0</span></div>
            <div id="feedbackDisplay" style="color:var(--mint); font-weight:800; font-size:12px">ГОТОВЫ</div>
        </div>
        
        <button id="shuffleBtn" class="primary-btn" style="padding:12px; font-size:13px;">↻ НОВОЕ ЗАДАНИЕ</button>
        
        <div id="imageContainer" class="grid">
            <img class="image-card">
            <img class="image-card">
            <img class="image-card">
            <img class="image-card">
        </div>

        <div id="statusArea" class="tap-area">Сыграй или проговори ритм</div>
        <div id="teacherActions" class="teacher-actions visible">
            <button id="correctBtn" class="review-btn correct" type="button">✓ Верно · засчитать</button>
            <button id="repeatBtn" class="review-btn repeat" type="button">↻ Повторить</button>
        </div>
        
        <div class="tempo-card">
            <button id="metronomeBtn" class="primary-btn" style="margin:0">▶ Запустить метроном</button>
            <div class="tempo-line" style="margin-top:14px"><span>ТЕМП</span><span id="bpmValue">120 BPM</span></div>
            <input type="range" id="bpmRange" min="60" max="180" value="120" aria-label="Темп метронома">
        </div>
    </div>
</div>

<script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const levelPacks = {
        1: [{ src: "Lvl1/s1.png", size: 1, pattern: [0] }, { src: "Lvl1/Size2/6.png", size: 2, pattern: [0] }],
        2: [{ src: "lvl2/2.png", size: 1, pattern: [0, 0.5] }],
        3: [{ src: "Lvl3/4.png", size: 1, pattern: [] }, { src: "Lvl3/5.png", size: 1, pattern: [] }, { src: "Lvl3/Size2/30.png", size: 2, pattern: [] }],
        4: [{ src: "Lvl4/size2/9.png", size: 2, pattern: [0, 1, 1.5] }],
        5: [{ src: "Lvl5/3.png", size: 1, pattern: [0.5] }],
        6: [{ src: "Lvl6/Size2/7.png", size: 2, pattern: [0, 1.5] }, { src: "Lvl6/Size2/8.png", size: 2, pattern: [0, 0.5] }],
        7: [{ src: "Lvl7/Size2/10.png", size: 2, pattern: [0.5, 1.5] }, { src: "Lvl7/Size2/11.png", size: 2, pattern: [0.5] }],
        8: [{ src: "Lvl8/24.png", size: 1, pattern: [0, 0.25, 0.5, 0.75] }],
        9: [{ src: "Lvl9/27.png", size: 1, pattern: [0, 0.5, 0.75] }, { src: "Lvl9/26.png", size: 1, pattern: [0, 0.25, 0.5] }],
        10: [{ src: "Lvl10/13.png", size: 1, pattern: [0, 0.25, 0.50] }, { src: "Lvl10/15.png", size: 1, pattern: [0, 0.50, 0.75] }],
        11: [{ src: "Lvl11/18.png", size: 1, pattern: [0.50, 0.75] }, { src: "Lvl11/19.png", size: 1, pattern: [0, 0.25] }],
        12: [{ src: "Lvl12/25.png", size: 1, pattern: [0.25, 0.5, 0.75] }],
        13: [{ src: "Lvl13/14.png", size: 1, pattern: [0, 0.25, 0.75] }, { src: "Lvl13/31.png", size: 1, pattern: [0, 0.75] }],
        14: [{ src: "Lvl14/20.png", size: 1, pattern: [0, 0.5] }],
        15: [{ src: "Lvl15/17.png", size: 1, pattern: [0, 0.25] }, { src: "Lvl15/23.png", size: 1, pattern: [0, 0.75] }],
        16: [{ src: "Lvl16/21.png", size: 1, pattern: [0.25, 0.5, 0.75] }],
        17: [{ src: "Lvl17/16.png", size: 1, pattern: [0.25, 0.75] }, { src: "Lvl17/33.png", size: 1, pattern: [0.25] }],
        18: [{ src: "Lvl18/34.png", size: 1, pattern: [0.75] }],
        19: [{ src: "Lvl19/12.png", size: 1, pattern: [0, 0.33, 0.66] }]
    };


    const readStored = (key, fallback) => {
        try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
        catch (error) { return fallback; }
    };
    const legacyStars = readStored('rhythm_stars', {});
    let students = readStored('rhythmic_students', []);
    if (!Array.isArray(students)) students = [];
    if (students.length === 0) {
        students = [{ id: `student-${Date.now()}`, name: 'Ученик 1', level: 1, stars: legacyStars }];
    }
    let activeStudentId = localStorage.getItem('rhythmic_active_student_id');
    if (!students.some(student => student.id === activeStudentId)) activeStudentId = students[0].id;
    let activeStudent = students.find(student => student.id === activeStudentId);
    let currentLevel = Math.min(19, Math.max(1, Number(activeStudent.level) || 1)), score = 0;
    let audioCtx, nextBeatTime, timerID;
    let perfectStreak = 0, lastStarsCount = 0;
    let currentSequence = [];
    
    let micStream = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let state = 'IDLE'; 
    let beatCount = 0;
    let currentPatternReviewed = false;
    
    let levelStars = activeStudent.stars || {};
    let lessonMode = localStorage.getItem('rhythmic_mode') || 'teacher';

    function persistActiveStudent() {
        activeStudent.level = currentLevel;
        activeStudent.stars = levelStars;
        localStorage.setItem('rhythmic_students', JSON.stringify(students));
        localStorage.setItem('rhythmic_active_student_id', activeStudentId);
    }

    function updateStudentSummary() {
        const starCount = Object.values(levelStars).reduce((sum, value) => sum + Number(value || 0), 0);
        const completedLevels = Object.keys(levelStars).filter(level => Number(levelStars[level]) > 0).length;
        document.getElementById('studentLevelMeta').innerText = `Текущий уровень ${currentLevel}`;
        document.getElementById('studentProgressMeta').innerText = starCount
            ? `${starCount} ★ · ${completedLevels} уровней с результатом`
            : 'Начинаем с чистого листа';
        document.getElementById('activeStudentChip').innerText = activeStudent.name;
    }

    function renderStudentSelector() {
        const select = document.getElementById('studentSelect');
        select.innerHTML = '';
        students.forEach(student => {
            const option = document.createElement('option');
            option.value = student.id;
            option.textContent = student.name;
            option.selected = student.id === activeStudentId;
            select.appendChild(option);
        });
        updateStudentSummary();
    }

    function setActiveStudent(id) {
        activeStudent = students.find(student => student.id === id);
        if (!activeStudent) return;
        activeStudentId = id;
        currentLevel = Math.min(19, Math.max(1, Number(activeStudent.level) || 1));
        levelStars = activeStudent.stars || {};
        perfectStreak = 0;
        lastStarsCount = 0;
        persistActiveStudent();
        renderStudentSelector();
        initLevels();
    }

    function setLessonMode(mode) {
        lessonMode = mode;
        localStorage.setItem('rhythmic_mode', mode);
        document.getElementById('teacherModeBtn').classList.toggle('active', mode === 'teacher');
        document.getElementById('autoModeBtn').classList.toggle('active', mode === 'auto');
        document.getElementById('teacherActions').classList.toggle('visible', mode === 'teacher');
        document.getElementById('statusArea').innerText = mode === 'teacher'
            ? 'Сыграй или проговори ритм'
            : '🎙️ Готов к записи';
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        document.getElementById(id).style.display = 'block';
    }

    function updateRank() {
        let total = Object.values(levelStars).reduce((a, b) => a + b, 0);
        document.getElementById('totalStarsDisplay').innerText = `★ ${total}`;
        let rank = "Начало пути", color = "var(--muted)";
        if (total >= 40) { rank = "Маэстро"; color = "var(--gold)"; }
        else if (total >= 25) { rank = "Мастер"; color = "var(--mint)"; }
        else if (total >= 10) { rank = "Уверенный ритм"; color = "var(--mint)"; }
        const rEl = document.getElementById('playerRank');
        rEl.innerText = rank; rEl.style.color = color;
    }

    function initLevels() {
        updateRank();
        updateStudentSummary();
        const grid = document.getElementById('levelsGrid');
        grid.innerHTML = '';
        for(let i=1; i<=19; i++) {
            const b = document.createElement('button');
            const stars = levelStars[i] || 0;
            b.className = 'level-btn' + (i === currentLevel ? ' active' : '');
            b.innerHTML = `<span>${i}</span><span class="level-stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</span>`;
            b.onclick = () => { currentLevel = i; persistActiveStudent(); initLevels(); };
            grid.appendChild(b);
        }
    }

    function updateStarsUI() {
        const display = document.getElementById('gameStarsDisplay');
        let currentStars = perfectStreak >= 5 ? 3 : (perfectStreak >= 2 ? 2 : (perfectStreak >= 1 ? 1 : 0));
        display.innerHTML = '';
        for(let s=0; s<3; s++) {
            const span = document.createElement('span');
            span.className = 'star-item' + (s < currentStars ? ' filled' : '');
            if (s < currentStars && s >= lastStarsCount) span.classList.add('star-pop');
            span.innerText = '★';
            display.appendChild(span);
        }
        if (currentStars > (levelStars[currentLevel] || 0)) {
            levelStars[currentLevel] = currentStars;
            persistActiveStudent();
            updateStudentSummary();
        }
        lastStarsCount = currentStars;
    }

    function roll() {
        currentPatternReviewed = false;
        document.getElementById('correctBtn').disabled = false;
        document.getElementById('repeatBtn').disabled = false;
        const pool = [];
        
        for(let i = 1; i <= currentLevel; i++) {
            if(levelPacks[i]) {
                pool.push(...levelPacks[i]);
                if (i === currentLevel) {
                    pool.push(...levelPacks[i]); 
                }
            }
        }
        
        let seq = [], total = 0;
        while(total < 4) {
            let item = pool[Math.floor(Math.random() * pool.length)];
            if(total + item.size <= 4) { seq.push(item); total += item.size; }
        }
        currentSequence = seq;

        const images = document.querySelectorAll('#imageContainer .image-card');
        images.forEach(img => {
            img.style.display = 'none';
            img.classList.remove('loaded', 'active-slot');
        });

        seq.forEach((item, idx) => {
            const img = images[idx];
            img.src = item.src;
            img.className = 'image-card' + (item.size === 2 ? ' double-size' : '');
            img.style.display = 'block';
            img.onload = () => img.classList.add('loaded');
        });
    }

    async function initMic() {
        if (micStream) return true;
        try {
            micStream = await navigator.mediaDevices.getUserMedia({ 
                audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
            });
            return true;
        } catch (e) {
            alert("Пожалуйста, разрешите доступ к микрофону для игры!");
            return false;
        }
    }

    function startEngine() {
        state = lessonMode === 'teacher' ? 'TEACHER' : 'COUNTDOWN';
        beatCount = 0;
        nextBeatTime = audioCtx.currentTime;
        document.getElementById('statusArea').className = lessonMode === 'teacher' ? 'tap-area recording' : 'tap-area';
        document.getElementById('statusArea').innerText = lessonMode === 'teacher' ? 'Метроном идёт · сыграй или проговори' : 'Приготовься к отсчёту';
        scheduler();
        document.getElementById('metronomeBtn').innerText = "■ Остановить метроном";
        document.getElementById('metronomeBtn').disabled = false;
    }

    function playTick() {
        const bpm = document.getElementById('bpmRange').value;
        const spb = 60 / bpm;
        const now = audioCtx.currentTime;
        const statusArea = document.getElementById('statusArea');

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = (beatCount === 0) ? 880 : 440;
        
        gain.gain.setValueAtTime(0.8, now); 
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.1);

        if (state === 'TEACHER') {
            document.getElementById('feedbackDisplay').innerText = `ДОЛЯ ${beatCount + 1} ИЗ 4`;
            const cards = document.querySelectorAll('.image-card');
            cards.forEach(c => c.classList.remove('active-slot'));
            let acc = 0;
            currentSequence.forEach((item, idx) => {
                if (beatCount >= acc && beatCount < acc + item.size) cards[idx].classList.add('active-slot');
                acc += item.size;
            });
            beatCount = (beatCount + 1) % 4;
        } else if (state === 'COUNTDOWN') {
            document.getElementById('feedbackDisplay').innerText = `ОТСЧЕТ: ${4 - beatCount}`;
            
            if (beatCount === 3) {
                startRecording();
            }

            beatCount++;
            if (beatCount === 4) {
                state = 'RECORDING';
                beatCount = 0;
                statusArea.className = 'tap-area recording';
                statusArea.innerText = "🔴 ИДЕТ ЗАПИСЬ!";
            }
        } 
        else if (state === 'RECORDING') {
            document.getElementById('feedbackDisplay').innerText = "ИГРАЙТЕ!";
            
            const cards = document.querySelectorAll('.image-card');
            cards.forEach(c => c.classList.remove('active-slot'));
            let acc = 0;
            currentSequence.forEach((item, idx) => {
                if (beatCount >= acc && beatCount < acc + item.size) cards[idx].classList.add('active-slot');
                acc += item.size;
            });

            beatCount++;
            if (beatCount === 4) {
                state = 'ANALYZING';
                statusArea.className = 'tap-area analyzing';
                statusArea.innerText = "⚙️ ОБРАБОТКА...";
                document.getElementById('feedbackDisplay').innerText = "АНАЛИЗ...";
                
                setTimeout(stopRecording, (spb + 0.3) * 1000);
            }
        }
    }

    function scheduler() {
        if (state === 'IDLE' || state === 'ANALYZING') return;
        const bpm = document.getElementById('bpmRange').value;
        const spb = 60 / bpm;
        
        while(nextBeatTime < audioCtx.currentTime + 0.1) {
            playTick();
            nextBeatTime += spb;
        }
        timerID = setTimeout(scheduler, 25);
    }

    function startRecording() {
        audioChunks = [];
        mediaRecorder = new MediaRecorder(micStream);
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = processAudio;
        mediaRecorder.start();
    }

    function stopRecording() {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
        }
    }

    async function processAudio() {
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        const arrayBuffer = await blob.arrayBuffer();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        const data = audioBuffer.getChannelData(0);
        const sampleRate = audioBuffer.sampleRate;
        
        let maxVol = 0;
        for(let i=0; i<data.length; i++) if(Math.abs(data[i]) > maxVol) maxVol = Math.abs(data[i]);
        
        const threshold = Math.max(0.03, maxVol * 0.25);
        const peaks = [];
        
        // Уменьшенное окно "склейки" хлопков, чтобы ловить быстрые ноты (было 0.10, стало 0.08)
        const debounceFrames = sampleRate * 0.08; 
        let lastPeakFrame = -debounceFrames;
        
        for (let i = 0; i < data.length; i++) {
            if (Math.abs(data[i]) > threshold) {
                if (i - lastPeakFrame > debounceFrames) {
                    peaks.push(i / sampleRate);
                    lastPeakFrame = i;
                }
            }
        }

        const bpm = document.getElementById('bpmRange').value;
        const spb = 60 / bpm;

        const expectedTargets = [];
        let acc = 0;
        currentSequence.forEach(item => {
            item.pattern.forEach(p => expectedTargets.push((1 + acc + p) * spb));
            acc += item.size;
        });

        evaluateGameplay(peaks, expectedTargets, spb);
    }

    function evaluateGameplay(peaks, expectedTargets, spb) {
        const fb = document.getElementById('feedbackDisplay');

        if (expectedTargets.length === 0) {
            if (peaks.length === 0) {
                score += 100;
                perfectStreak++;
                fb.innerText = "ИДЕАЛЬНАЯ ПАУЗА!"; fb.style.color = "#00cec9";
                setTimeout(roll, 1000); 
            } else {
                score = Math.max(0, score - 50);
                perfectStreak = 0;
                fb.innerText = `ОШИБКА: ЛИШНИЕ НОТЫ В ПАУЗЕ`; fb.style.color = "#ff4757";
            }
            updateStarsUI();
            resetEngine("statusArea", "metronomeBtn");
            return;
        }

        if (peaks.length === 0) {
            score = Math.max(0, score - 50);
            document.getElementById('scoreDisplay').innerText = score;
            fb.innerText = "НИЧЕГО НЕ УСЛЫШАЛ"; fb.style.color = "#ff4757";
            perfectStreak = 0;
            updateStarsUI();
            resetEngine("statusArea", "metronomeBtn");
            return;
        }

        const firstExpectedTarget = expectedTargets[0]; 
        const firstPlayedNote = peaks[0];               
        let shift = firstPlayedNote - firstExpectedTarget; 

        // Динамический предел сдвига грува (чтобы не ломать ритм при долгом опоздании)
        if (Math.abs(shift) > spb * 0.6) {
            shift = 0;
        }

        let cycleHits = 0;
        let cycleMisses = 0;
        const matchedPeaks = new Set();
        
        // НОВЫЕ, СТРОГИЕ ОКНА ПОГРЕШНОСТИ, ЗАВИСЯЩИЕ ОТ ТЕМПА (BPM)
        const perfectWindow = spb * 0.15; // 15% от доли (очень точно)
        const goodWindow = spb * 0.28;    // 28% от доли (прощает мелкие огрехи, но отличает ритмы)

        expectedTargets.forEach(target => {
            let bestDiff = Infinity;
            let bestPeakIdx = -1;
            
            const adjustedTarget = target + shift; 
            
            peaks.forEach((peak, pIdx) => {
                if (matchedPeaks.has(pIdx)) return;
                const diff = Math.abs(peak - adjustedTarget);
                if (diff < bestDiff) { bestDiff = diff; bestPeakIdx = pIdx; }
            });
            
            if (bestDiff <= perfectWindow) { 
                cycleHits++; score += 100; matchedPeaks.add(bestPeakIdx); 
            } else if (bestDiff <= goodWindow) { 
                cycleHits++; score += 50; matchedPeaks.add(bestPeakIdx); 
            } else { 
                cycleMisses++; score = Math.max(0, score - 30); 
            }
        });
        
        const extraPeaks = peaks.length - matchedPeaks.size;
        score = Math.max(0, score - (extraPeaks * 15));
        document.getElementById('scoreDisplay').innerText = score;
        
        if (cycleHits === expectedTargets.length && cycleMisses === 0 && extraPeaks === 0) {
            perfectStreak++;
            fb.innerText = "ОТЛИЧНО!"; fb.style.color = "#00cec9";
            setTimeout(roll, 1000); 
        } else {
            perfectStreak = 0;
            fb.innerText = `ОШИБКИ (Ноты: ${peaks.length}/${expectedTargets.length})`; fb.style.color = "#ff4757";
        }
        
        updateStarsUI();
        resetEngine("statusArea", "metronomeBtn");
    }

    function resetEngine(statusAreaId, btnId) {
        clearTimeout(timerID);
        state = 'IDLE';
        const statusArea = document.getElementById(statusAreaId);
        statusArea.className = 'tap-area';
        statusArea.innerText = lessonMode === 'teacher' ? 'Сыграй или проговори ритм' : '🎙️ Готов к записи';
        
        const btn = document.getElementById(btnId);
        btn.innerText = "▶ Запустить метроном";
        btn.disabled = false;
        document.querySelectorAll('.image-card').forEach(c => c.classList.remove('active-slot'));
    }

    document.getElementById('startGameBtn').onclick = () => { 
        persistActiveStudent();
        showScreen('gameScreen');
        document.getElementById('currentLevelDisplay').innerText = currentLevel;
        document.getElementById('activeStudentChip').innerText = activeStudent.name;
        document.getElementById('scoreDisplay').innerText = '0';
        score = 0;
        perfectStreak = 0; lastStarsCount = 0; updateStarsUI(); roll();
    };

    document.getElementById('backBtn').onclick = () => { initLevels(); showScreen('menuScreen'); };

    document.getElementById('metronomeBtn').onclick = async function() {
        if (state !== 'IDLE') {
            clearTimeout(timerID);
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.onstop = null;
                mediaRecorder.stop();
            }
            resetEngine('statusArea', 'metronomeBtn');
            document.getElementById('feedbackDisplay').innerText = 'МЕТРОНОМ ОСТАНОВЛЕН';
            return;
        }
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (lessonMode === 'teacher') {
            startEngine();
        } else if (await initMic()) {
            startEngine();
        }
    };

    document.getElementById('shuffleBtn').onclick = () => {
        roll();
        if (lessonMode === 'teacher') {
            document.getElementById('feedbackDisplay').innerText = 'НОВЫЙ РИТМ';
            document.getElementById('statusArea').innerText = 'Сыграй или проговори новый ритм';
        }
    };
    document.getElementById('bpmRange').oninput = function() { document.getElementById('bpmValue').innerText = this.value + " BPM"; };

    document.getElementById('correctBtn').onclick = () => {
        if (currentPatternReviewed) return;
        currentPatternReviewed = true;
        document.getElementById('correctBtn').disabled = true;
        document.getElementById('repeatBtn').disabled = true;
        score += 100;
        document.getElementById('scoreDisplay').innerText = score;
        perfectStreak++;
        document.getElementById('feedbackDisplay').innerText = 'ЗАСЧИТАНО · ОТЛИЧНАЯ РАБОТА';
        document.getElementById('statusArea').innerText = 'Готово. Можно дать следующий ритм.';
        updateStarsUI();
    };

    document.getElementById('repeatBtn').onclick = () => {
        perfectStreak = 0;
        document.getElementById('feedbackDisplay').innerText = 'ПОВТОРЯЕМ ЭТОТ РИТМ';
        document.getElementById('statusArea').innerText = 'Не спешим — повтори ещё раз';
        updateStarsUI();
    };

    document.getElementById('studentSelect').onchange = event => setActiveStudent(event.target.value);
    document.getElementById('addStudentBtn').onclick = () => {
        const name = prompt('Имя ученика:');
        if (!name || !name.trim()) return;
        const student = { id: `student-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`, name: name.trim().slice(0, 32), level: 1, stars: {} };
        students.push(student);
        setActiveStudent(student.id);
    };
    document.getElementById('renameStudentBtn').onclick = () => {
        const name = prompt('Новое имя ученика:', activeStudent.name);
        if (!name || !name.trim()) return;
        activeStudent.name = name.trim().slice(0, 32);
        persistActiveStudent();
        renderStudentSelector();
    };
    document.getElementById('deleteStudentBtn').onclick = () => {
        if (students.length === 1) { alert('Оставь хотя бы один профиль ученика.'); return; }
        if (!confirm(`Удалить профиль «${activeStudent.name}» и его прогресс?`)) return;
        students = students.filter(student => student.id !== activeStudentId);
        activeStudentId = students[0].id;
        setActiveStudent(activeStudentId);
    };
    document.getElementById('teacherModeBtn').onclick = () => setLessonMode('teacher');
    document.getElementById('autoModeBtn').onclick = () => setLessonMode('auto');

    renderStudentSelector();
    setLessonMode(lessonMode);
    initLevels();
</script>
